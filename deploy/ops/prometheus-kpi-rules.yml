# Generated by `tools/g5c-kpi --rules` from deploy/ops/kpis.json. Do not edit: change the definitions and regenerate.
groups:
  - name: g5c-kpi
    interval: 30s
    rules:
      - record: g5c_kpi_registration_attempts
        expr: sum(increase(g5c_amf_registrations_total[5m]))
        labels: {unit: "count", window: "5m"}
      - record: g5c_kpi_registration_success_rate
        expr: 100 * (sum(increase(g5c_amf_registrations_total{result="accepted"}[5m]))) / clamp_min(sum(increase(g5c_amf_registrations_total[5m])), 1)
        labels: {unit: "percent", window: "5m"}
      - record: g5c_kpi_authentication_success_rate
        expr: 100 * (sum(increase(g5c_amf_authentications_total{result="success"}[5m]))) / clamp_min(sum(increase(g5c_amf_authentications_total[5m])), 1)
        labels: {unit: "percent", window: "5m"}
      - record: g5c_kpi_service_request_success_rate
        expr: 100 * (sum(increase(g5c_amf_service_requests_total{result="accepted"}[5m]))) / clamp_min(sum(increase(g5c_amf_service_requests_total[5m])), 1)
        labels: {unit: "percent", window: "5m"}
      - record: g5c_kpi_pdu_session_establishment_success_rate
        expr: 100 * (sum(increase(g5c_amf_pdu_session_requests_total{result="created"}[5m]))) / clamp_min(sum(increase(g5c_amf_pdu_session_requests_total[5m])), 1)
        labels: {unit: "percent", window: "5m"}
      - record: g5c_kpi_handover_success_rate
        expr: 100 * (sum(increase(g5c_amf_handover_total{result="completed"}[5m]))) / clamp_min(sum(increase(g5c_amf_handover_total[5m])), 1)
        labels: {unit: "percent", window: "5m"}
      - record: g5c_kpi_nas_procedure_timeouts
        expr: sum(increase(g5c_amf_procedure_timeouts_total[5m]))
        labels: {unit: "count", window: "5m"}
      - record: g5c_kpi_registered_ues
        expr: sum(g5c_amf_registered_ues)
        labels: {unit: "count", window: "5m"}
      - record: g5c_kpi_connected_ues
        expr: sum(g5c_amf_connected_ues)
        labels: {unit: "count", window: "5m"}
      - record: g5c_kpi_active_pdu_sessions
        expr: sum(g5c_smf_pdu_sessions_active)
        labels: {unit: "count", window: "5m"}
      - record: g5c_kpi_connected_gnbs
        expr: sum(g5c_amf_gnbs)
        labels: {unit: "count", window: "5m"}
      - record: g5c_kpi_sm_context_create_p95
        expr: histogram_quantile(0.95, sum by (le) (rate(g5c_smf_create_sm_context_seconds_bucket[5m])))
        labels: {unit: "seconds", window: "5m"}
      - record: g5c_kpi_sbi_error_rate
        expr: 100 * (sum(increase(g5c_sbi_requests_total{status=~"5.."}[5m]))) / clamp_min(sum(increase(g5c_sbi_requests_total[5m])), 1)
        labels: {unit: "percent", window: "5m"}
      - record: g5c_kpi_uplink_throughput
        expr: (sum(rate(g5c_upf_bytes_total{direction="uplink"}[5m]))) * 8
        labels: {unit: "bit/s", window: "5m"}
      - record: g5c_kpi_downlink_throughput
        expr: (sum(rate(g5c_upf_bytes_total{direction="downlink"}[5m]))) * 8
        labels: {unit: "bit/s", window: "5m"}
      - record: g5c_kpi_user_plane_drop_rate
        expr: 100 * (sum(increase(g5c_upf_dropped_packets_total[5m]))) / clamp_min(sum(increase(g5c_upf_packets_total[5m])) + sum(increase(g5c_upf_dropped_packets_total[5m])), 1)
        labels: {unit: "percent", window: "5m"}
      - record: g5c_kpi_charging_records
        expr: sum(increase(g5c_smf_cdrs_written_total[5m]))
        labels: {unit: "count", window: "5m"}
