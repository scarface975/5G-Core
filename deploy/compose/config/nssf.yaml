# Compose NSSF configuration (see configs/nssf.yaml for every option).
name: nssf-1
plmn: { mcc: '001', mnc: '01' }
sbi: { address: 0.0.0.0, port: 7783 }
log: { level: info, json: true }
nrf: { uri: 'http://nrf:7777' }
nssf:
  slices:
    - { snssai: { sst: 1 } }
  state_file: /var/lib/g5c/nssf.json
