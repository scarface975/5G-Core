# Compose PCF configuration.
name: pcf-1
plmn: { mcc: '001', mnc: '01' }
sbi: { address: 0.0.0.0, port: 7777 }
log: { level: info, json: true }
udr: { uri: 'http://udr:7790' }
admin_token_file: /etc/g5c/keys/pcf-admin.token
policy:
  rfsp: 1
  default:
    session_ambr: { uplink: 1 Gbps, downlink: 2 Gbps }
