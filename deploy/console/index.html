<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>g5c console</title>
<style>
:root{--bg:#f6f8fa;--fg:#1f2328;--card:#fff;--line:#d0d7de;--accent:#1f3a5f;--bad:#b3261e;--ok:#1b7f3b}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--card:#161b22;--line:#30363d;--accent:#6cb6c4;--bad:#ff8a80;--ok:#56d364}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:16px;margin:0;color:var(--accent)}main{padding:16px;max-width:1000px;margin:auto}
nav button,button{font:inherit;padding:5px 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}
nav button[aria-pressed=true]{background:var(--accent);color:var(--bg)}button.danger{color:var(--bad)}
input,textarea,select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);max-width:100%}
textarea{width:100%;min-height:110px;font-family:ui-monospace,monospace}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.msg{padding:6px 10px;border-radius:6px;margin:8px 0}.msg.ok{border:1px solid var(--ok)}.msg.bad{border:1px solid var(--bad)}pre{overflow:auto;background:var(--bg);padding:8px;border-radius:6px}
</style>
</head>
<body>
<header>
<h1>g5c console</h1>
<nav id="tabs"></nav>
<span style="flex:1"></span>
<label>Admin token <input id="token" type="password" autocomplete="off" size="22"></label>
</header>
<main>
<div id="msg" role="status"></div>
<section id="view"></section>
<p style="opacity:.7">Talks to this function's own <code>/admin/v1</code> API; the token stays in this page and is sent only to this server. Policies and sessions are on the PCF.</p>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const tabs = ["Subscribers", "Add", "Import", "Health"];
let current = "Subscribers";

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) e[k] = v;
  for (const k of kids) e.append(k);
  return e;
}
function say(text, ok) {
  const m = $("msg");
  m.replaceChildren();
  if (text) m.append(el("div", { className: "msg " + (ok ? "ok" : "bad"), textContent: text }));
}
async function api(method, path, body) {
  const headers = { accept: "application/json" };
  if ($("token").value) headers.authorization = "Bearer " + $("token").value;
  if (body !== undefined) headers["content-type"] = "application/json";
  const r = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
  if (!r.ok) throw new Error(method + " " + path + ": HTTP " + r.status + (data && data.cause ? " " + data.cause : "") + (data && data.detail ? " (" + data.detail + ")" : ""));
  return data;
}
function supisOf(list) {
  const arr = Array.isArray(list) ? list : (list && (list.subscribers || list.supis)) || [];
  return arr.map((x) => (typeof x === "string" ? x : x && x.supi)).filter(Boolean);
}
function parseRecords(text) {
  const t = text.trim();
  if (!t) return [];
  if (t[0] === "[") return JSON.parse(t);
  return t.split(/\r?\n/).filter((l) => l.trim()).map((l, i) => { try { return JSON.parse(l); } catch (e) { throw new Error("line " + (i + 1) + " is not JSON"); } });
}

async function viewSubscribers() {
  const box = el("div", { className: "card" });
  const filter = el("input", { placeholder: "filter by SUPI", size: 28 });
  const table = el("table");
  const detail = el("pre", { hidden: true });
  async function load() {
    say("");
    const supis = supisOf(await api("GET", "/admin/v1/subscribers")).sort();
    table.replaceChildren(el("tr", {}, el("th", { textContent: "SUPI" }), el("th", { textContent: "" })));
    for (const s of supis) {
      if (filter.value && !s.includes(filter.value)) continue;
      const show = el("button", { textContent: "show" });
      show.onclick = async () => { try { detail.textContent = JSON.stringify(await api("GET", "/admin/v1/subscribers/" + encodeURIComponent(s)), null, 1); detail.hidden = false; } catch (e) { say(e.message, false); } };
      const del = el("button", { textContent: "delete", className: "danger" });
      del.onclick = async () => { if (!confirm("Delete " + s + "?")) return; try { await api("DELETE", "/admin/v1/subscribers/" + encodeURIComponent(s)); say(s + " deleted", true); load(); } catch (e) { say(e.message, false); } };
      table.append(el("tr", {}, el("td", { textContent: s }), el("td", {}, show, " ", del)));
    }
    say(supis.length + " subscribers", true);
  }
  const reload = el("button", { textContent: "reload" });
  reload.onclick = () => load().catch((e) => say(e.message, false));
  filter.oninput = () => load().catch((e) => say(e.message, false));
  box.append(el("div", { className: "row" }, filter, reload), table, detail);
  $("view").replaceChildren(box);
  await load();
}

function viewAdd() {
  const f = {};
  const field = (name, label, ph, size) => { f[name] = el("input", { placeholder: ph || "", size: size || 36, autocomplete: "off" }); return el("div", { className: "row" }, el("label", { textContent: label + " " }, f[name])); };
  const go = el("button", { textContent: "Add subscriber" });
  go.onclick = async () => {
    const rec = { supi: f.supi.value.trim(), k: f.k.value.trim() };
    if (f.opc.value.trim()) rec.opc = f.opc.value.trim(); else if (f.op.value.trim()) rec.op = f.op.value.trim();
    if (f.slices.value.trim()) rec.slices = f.slices.value.split(",").map((s) => { const [sst, sd] = s.trim().split(":"); const o = { sst: Number(sst) }; if (sd) o.sd = sd; return o; });
    if (f.dnns.value.trim()) { rec.dnns = {}; for (const d of f.dnns.value.split(",")) rec.dnns[d.trim()] = {}; }
    try { const r = await api("POST", "/admin/v1/subscribers", rec); say("provisioned " + r.supi, true); f.k.value = ""; f.opc.value = ""; f.op.value = ""; } catch (e) { say(e.message, false); }
  };
  $("view").replaceChildren(el("div", { className: "card" }, field("supi", "SUPI", "imsi-001010000000001"), field("k", "K", "32 hex", 36), field("opc", "OPc", "32 hex (or OP below)", 36), field("op", "OP", "32 hex", 36),
    field("slices", "Slices", "1,2:010203", 20), field("dnns", "DNNs", "internet,ims", 20), el("div", { className: "row" }, go),
    el("p", { textContent: "K and OPc are encrypted by the UDM before they reach the database and are never shown again." })));
}

function viewImport() {
  const ta = el("textarea", { placeholder: "one JSON subscriber per line, or a JSON array (the /admin/v1/subscribers format)" });
  const file = el("input", { type: "file" });
  file.onchange = async () => { if (file.files[0]) ta.value = await file.files[0].text(); };
  const go = el("button", { textContent: "Import" });
  const out = el("pre");
  go.onclick = async () => {
    let recs;
    try { recs = parseRecords(ta.value); } catch (e) { say(e.message, false); return; }
    let ok = 0; const bad = [];
    for (const r of recs) { try { await api("POST", "/admin/v1/subscribers", r); ok++; } catch (e) { bad.push((r && r.supi) + ": " + e.message); } }
    out.textContent = bad.join("\n");
    say(ok + " imported, " + bad.length + " failed", bad.length === 0);
  };
  $("view").replaceChildren(el("div", { className: "card" }, el("div", { className: "row" }, file), ta, el("div", { className: "row" }, go), out,
    el("p", { textContent: "Records are checked by the UDM. For Open5GS and free5GC dumps convert first with tools/g5c-subscribers." })));
}

async function viewHealth() {
  const out = el("pre");
  const rw = el("button", { textContent: "Re-protect credentials with the current master key (rewrap)", className: "danger" });
  rw.onclick = async () => { if (!confirm("Run the master key rewrap now?")) return; try { say(JSON.stringify(await api("POST", "/admin/v1/keys/rewrap")), true); } catch (e) { say(e.message, false); } };
  $("view").replaceChildren(el("div", { className: "card" }, out, el("div", { className: "row" }, rw)));
  const lines = [];
  for (const p of ["/health/live", "/health/ready"]) { try { const r = await fetch(p); lines.push(p + " " + r.status); } catch (e) { lines.push(p + " " + e.message); } }
  out.textContent = lines.join("\n");
}

function show(tab) {
  current = tab;
  for (const b of $("tabs").children) b.setAttribute("aria-pressed", String(b.textContent === tab));
  say("");
  const run = { Subscribers: viewSubscribers, Add: viewAdd, Import: viewImport, Health: viewHealth }[tab];
  Promise.resolve(run()).catch((e) => say(e.message, false));
}
for (const t of tabs) { const b = el("button", { textContent: t }); b.onclick = () => show(t); $("tabs").append(b); }
show(current);
</script>
</body>
</html>
