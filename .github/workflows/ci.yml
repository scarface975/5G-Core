name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev libnghttp2-dev libuv1-dev
      - name: Build and test (plain, then under ASan + UBSan)
        run: |
          set +e
          bash scripts/c_check.sh 2>&1 | tee check.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # the failing tests and the first lines of what they printed, as annotations (the log itself is visible only to signed-in users)
            names=$(grep -E '^\s+[0-9]+ - .*\((Failed|Timeout|Not Run)' check.log | sed 's/  */ /g' | tr '\n' ';')
            echo "::error title=failed tests::${names:0:900}"
            grep -nE 'FAIL|assertion failed|Assertion|ERROR|error:|SKIP' check.log | head -40 | cut -c1-200 | while IFS= read -r l; do echo "::warning::${l}"; done
          fi
          exit $rc
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev libnghttp2-dev libuv1-dev
      - name: Banned functions, licences, gcc -fanalyzer
        run: bash scripts/c_lint.sh
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake pkg-config libssl-dev libnghttp2-dev libuv1-dev
      - name: Coverage-guided fuzzing, 30 s per target
        run: |
          CC=clang cmake -S . -B build-fuzz -DG5C_FUZZ=ON -DG5C_SANITIZE=OFF -DG5C_WERROR=OFF
          cmake --build build-fuzz -j"$(nproc)"
          for t in nas ngap pfcp_gtpu json_yaml; do
            mkdir -p corpus/$t
            ./build-fuzz/fuzz/fuzz_$t -max_total_time=30 corpus/$t
          done
