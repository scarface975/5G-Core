# Sample CHF configuration (Charging Function, Nchf_ConvergedCharging, TS 32.291). The SMF opens a charging session for every PDU session (smf.chf) and gets a volume quota.
name: chf-1
plmn: { mcc: '001', mnc: '01' }
sbi: { address: 0.0.0.0, port: 7787 }
log: { level: info, json: true }
nrf: { uri: 'http://nrf:7777' }

chf:
  default_balance_bytes: 1073741824   # what a subscriber without an entry below holds; omit for unlimited
  accounts:                           # by SUPI prefix, the first entry that matches counts
    - { supi: 'imsi-0010100', balance_bytes: 5000000000 }
  max_grant_bytes: 10485760           # most a single grant hands out
  validity_s: 300                     # how long a grant is valid
  max_sessions: 200000                # more: 503
  cdr_file: /var/lib/g5c/chf-cdr.jsonl   # one JSON record per closed session
