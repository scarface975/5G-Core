# Sample SMF configuration.
name: smf-1
plmn: { mcc: '001', mnc: '01' }
sbi: { address: 0.0.0.0, port: 7777 }
log: { level: info, json: true }
nrf: { uri: 'http://nrf:7777' }
smf:
  udm: { uri: 'http://udm:7777' }
  pcf: { uri: 'http://pcf:7777' }
  # amf: { uri: 'http://amf:7777' }   # optional: by default the AMF is discovered through the NRF by its servingNfId, else reached at the host of the smContextStatusUri
  mtu: 1400                           # IPv4 link MTU offered to UEs that ask for it (extended PCO)
  slices: [ { sst: 1 } ]              # advertised to the NRF together with the DNNs below
  state_file: /var/lib/g5c/smf-state.json   # PDU sessions are written here and restored at start-up (omit for none)
  release_guard_ms: 10000             # how long a network-requested release waits for the UE's complete
  n4:
    address: 10.100.0.4               # a specific address: it is the Node ID and the F-SEID address sent to the UPFs
    port: 8805
    t1_ms: 1000
    n1: 3
    heartbeat: { interval: 5, failures: 3 }
    lost_after: 30                    # seconds of silence after which a UPF's sessions are released towards the AMF (0: never)
  upfs:
    - { name: upf-1, address: 10.100.0.7, port: 8805, dnns: [internet] }
  dnns:
    - { name: internet, ipv4_pool: 10.45.0.0/16, ipv6_pool: '2001:db8:45::/48', dns: [8.8.8.8, 8.8.4.4] }
  # chf: { uri: 'http://chf:7787', rating_group: 1, quota_bytes: 10485760, required: true }   # online charging: a session the CHF denies is refused
  # slice_limits: [ { sst: 1, max_sessions: 5000 } ]   # most PDU sessions per slice (cause #69 above it)
