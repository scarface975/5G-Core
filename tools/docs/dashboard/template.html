<title>5G Core Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a console. Sticky header with the headline numbers, a tab bar, then one working surface per tab:
   topology map, NF explorer, procedure ladders, traceability table, quality board, roadmap. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --surface2: #f6f8fa; --ink: #14202b; --muted: #566676; --line: #d3dbe3;
  --accent: #0a6e78; --accent-ink: #ffffff; --accent-soft: #d9eef0;
  --verified: #1d7f46; --tested: #2a64a8; --codec: #a9690f; --planned: #7a8997; --bad: #b8332a;
  --verified-soft: #dcf1e4; --tested-soft: #dde9f7; --codec-soft: #f6e8cf; --planned-soft: #e7ecf0; --bad-soft: #f8dfdc;
  --font-display: "Archivo", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e161d; --surface: #15212b; --surface2: #1a2835; --ink: #e4ebf1; --muted: #93a4b3; --line: #27384a;
    --accent: #3cc0cc; --accent-ink: #06242a; --accent-soft: #123a40;
    --verified: #46c47a; --tested: #6aa6ec; --codec: #e0a942; --planned: #8394a3; --bad: #ef7b6e;
    --verified-soft: #14301f; --tested-soft: #152a45; --codec-soft: #3a2c10; --planned-soft: #212f3b; --bad-soft: #3d1c19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e161d; --surface: #15212b; --surface2: #1a2835; --ink: #e4ebf1; --muted: #93a4b3; --line: #27384a;
  --accent: #3cc0cc; --accent-ink: #06242a; --accent-soft: #123a40;
  --verified: #46c47a; --tested: #6aa6ec; --codec: #e0a942; --planned: #8394a3; --bad: #ef7b6e;
  --verified-soft: #14301f; --tested-soft: #152a45; --codec-soft: #3a2c10; --planned-soft: #212f3b; --bad-soft: #3d1c19;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-body); padding-inline: 16px; padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 20px; font-weight: 600; } h3 { font-size: 15px; font-weight: 600; }
code, pre, .mono { font-family: var(--font-mono); font-size: 12.5px; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1240px; margin-inline: auto; }
.head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 0; border-bottom: 1px solid var(--line); }
.head-top { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; }
.brand { font: 700 22px var(--font-display); letter-spacing: -0.02em; }
.brand small { font: 500 12px var(--font-mono); color: var(--muted); margin-left: 10px; letter-spacing: 0; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--muted); align-items: center; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
.theme { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 10px; scrollbar-width: thin; }
.tab { border: 0; background: none; padding: 9px 14px; cursor: pointer; font-weight: 500; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
main { padding-block: 20px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
@media (max-width: 960px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.panel + .panel { margin-top: 14px; }
.muted { color: var(--muted); } .small { font-size: 12.5px; }
.pill { display: inline-block; font: 500 11.5px var(--font-mono); border-radius: 99px; padding: 1px 9px; border: 1px solid transparent; white-space: nowrap; }
.s-verified { color: var(--verified); background: var(--verified-soft); } .s-tested { color: var(--tested); background: var(--tested-soft); }
.s-codec, .s-partial, .s-shim, .s-next { color: var(--codec); background: var(--codec-soft); } .s-built, .s-done { color: var(--verified); background: var(--verified-soft); }
.s-planned, .s-peer, .s-out-of-scope { color: var(--planned); background: var(--planned-soft); } .s-gap, .s-fail, .s-high { color: var(--bad); background: var(--bad-soft); }
.s-medium { color: var(--codec); background: var(--codec-soft); } .s-low { color: var(--planned); background: var(--planned-soft); } .s-pass { color: var(--verified); background: var(--verified-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 12px; cursor: pointer; font-size: 12.5px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font: 600 11.5px var(--font-body); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface2); white-space: nowrap; }
td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface2); }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.bar { height: 8px; border-radius: 4px; background: var(--planned-soft); overflow: hidden; min-width: 80px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar.good > i { background: var(--verified); } .bar.mid > i { background: var(--codec); } .bar.low > i { background: var(--bad); }
input[type=search], select { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
pre { margin: 0; padding: 12px; background: var(--surface2); border: 1px solid var(--line); border-radius: 6px; overflow: auto; max-height: 420px; white-space: pre; }
/* map */
.mapbox { padding: 8px; }
svg.map { width: 100%; height: auto; display: block; }
svg.map text { font-family: var(--font-body); fill: var(--ink); }
.node rect { stroke-width: 1.5; } .node { cursor: pointer; }
.node.built rect { fill: var(--accent); stroke: var(--accent); } .node.built text { fill: var(--accent-ink); }
.node.shim rect, .node.partial rect { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: 5 3; }
.node.planned rect { fill: var(--surface); stroke: var(--planned); stroke-dasharray: 2 4; } .node.planned text { fill: var(--muted); }
.node.peer rect { fill: var(--planned-soft); stroke: var(--planned); }
.node.sel rect { stroke-width: 3.5; }
.edge { fill: none; stroke-width: 2.4; cursor: pointer; } .edge-hit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }
.e-verified { stroke: var(--verified); } .e-tested { stroke: var(--tested); } .e-codec { stroke: var(--codec); stroke-dasharray: 8 4; }
.e-planned { stroke: var(--planned); stroke-dasharray: 2 6; } .e-peer { stroke: var(--planned); stroke-dasharray: 1 5; }
.edge.sel { stroke-width: 4.5; } .dim { opacity: 0.32; }
.elabel { font: 500 11px var(--font-mono); } .elabel-bg { fill: var(--bg); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 26px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 6px; }
/* ladder */
.ladder { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow-x: auto; }
.lad-in { min-width: 760px; }
.lad-head, .lad-row { display: grid; grid-template-columns: 62px repeat(var(--n), minmax(0, 1fr)); }
.lad-head div { font: 600 12px var(--font-display); text-align: center; padding: 8px 0; border-bottom: 1px solid var(--line); background: var(--surface2); position: sticky; top: 0; }
.lad-row { position: relative; height: 38px; cursor: pointer; border-bottom: 1px dashed transparent; }
.lad-row:hover, .lad-row.sel { background: var(--accent-soft); }
.lad-row .t { font: 11px var(--font-mono); color: var(--muted); padding: 11px 6px 0 8px; }
.lad-row .cell { border-left: 1px solid var(--line); }
.lad-row .arrow { position: absolute; top: 24px; height: 0; border-top: 2px solid var(--ink); }
.lad-row .arrow.r::after, .lad-row .arrow.l::before { content: ""; position: absolute; top: -5px; border: 4px solid transparent; }
.lad-row .arrow.r::after { right: -1px; border-left: 7px solid currentColor; border-right: 0; }
.lad-row .arrow.l::before { left: -1px; border-right: 7px solid currentColor; border-left: 0; }
.lad-row .lbl { position: absolute; top: 2px; font-size: 11.5px; line-height: 1.25; text-align: center; white-space: nowrap; padding-inline: 5px; transform: translateX(-50%); max-width: 92%; overflow: hidden; text-overflow: ellipsis; background: color-mix(in srgb, var(--surface) 82%, transparent); border-radius: 4px; z-index: 1; }
.p-NGAP { color: var(--accent); } .p-PFCP { color: var(--codec); } .p-GTP-U { color: var(--verified); } .p-SBI { color: var(--tested); }
.p-NGAP .arrow, .p-PFCP .arrow, .p-GTP-U .arrow, .p-SBI .arrow { border-top-color: currentColor; }
.lad-row .lbl { color: var(--ink); }
.tree { font: 12.5px/1.55 var(--font-mono); }
.tree details { margin-left: 14px; } .tree summary { cursor: pointer; margin-left: -14px; }
.tree .k { color: var(--accent); } .tree .s { color: var(--verified); } .tree .n { color: var(--codec); } .tree .b { color: var(--tested); }
.tree .leaf { margin-left: 0; overflow-wrap: anywhere; }
.proc { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; margin-bottom: 8px; }
.proc[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.proc b { font-family: var(--font-display); display: block; } .proc span { font-size: 12.5px; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.card .big { font: 700 26px var(--font-display); font-variant-numeric: tabular-nums; }
.step { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.step:last-child { border: 0; } .step .i { font: 600 12px var(--font-mono); color: var(--accent-ink); background: var(--accent); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; }
.phase { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.phase .no { font: 700 26px var(--font-display); color: var(--accent); } .phase ul { margin: 4px 0 0; padding-left: 18px; } .phase li { margin: 2px 0; }
details.fold > summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
.copy { float: right; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
.sr { position: absolute; left: -9999px; }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .4s; } }
</style>

<div class="head"><div class="wrap">
  <div class="head-top">
    <div class="brand">5G Core Atlas<small id="gen"></small></div>
    <div class="stats" id="stats"></div>
    <button class="theme" id="theme" type="button">Theme</button>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
</div></div>
<main class="wrap" id="main"></main>

<script>
const DATA = /*__DATA__*/null;
(function () {
  "use strict";
  const $ = (s, r) => (r || document).querySelector(s);
  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const k in attrs || {}) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
    return e;
  }
  const svgNS = "http://www.w3.org/2000/svg";
  function sv(tag, attrs, ...kids) {
    const e = document.createElementNS(svgNS, tag);
    for (const k in attrs || {}) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c)));
    return e;
  }
  const pill = (s, text) => el("span", { class: "pill s-" + s, text: text || s });
  const pct = (h, l) => (l ? (100 * h / l) : 0);
  const cls = p => (p >= 90 ? "good" : p >= 75 ? "mid" : "low");
  const bar = (p) => el("div", { class: "bar " + cls(p), title: p.toFixed(1) + "%" }, el("i", { style: "width:" + p.toFixed(1) + "%" }));
  const D = DATA, byId = {};
  D.nodes.forEach(n => byId[n.id] = n);
  const testByName = {}; D.tests.forEach(t => testByName[t.name] = t);

  /* ---------------- header ---------------- */
  const cov = D.coverage.total || { hit: 0, lines: 0 };
  const mrows = D.matrix.rows, mcount = s => mrows.filter(r => r.status === s).length;
  const passed = D.tests.filter(t => t.status === "pass").length;
  $("#gen").textContent = "built from the repository · " + D.generated;
  $("#stats").append(
    el("span", {}, "phases done ", el("b", { text: D.phases.filter(p => p.status === "done").length + " of " + D.phases.length })),
    el("span", {}, "tests ", el("b", { text: (passed || D.tests.length) + (passed ? " passing" : "") })),
    el("span", {}, "line coverage ", el("b", { text: pct(cov.hit, cov.lines).toFixed(1) + "%" })),
    el("span", {}, "spec rows verified ", el("b", { text: mcount("verified") + " of " + mrows.length })));

  const themeBtn = $("#theme");
  try { const t = localStorage.getItem("atlas-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* storage may be blocked */ }
  themeBtn.addEventListener("click", () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("atlas-theme", next); } catch (e) { /* ignore */ }
  });

  /* ---------------- tabs ---------------- */
  const TABS = [["map", "Map", renderMap], ["nf", "NF explorer", renderNF], ["proc", "Procedures", renderProc],
    ["trace", "Spec traceability", renderTrace], ["quality", "Quality", renderQuality], ["road", "Roadmap", renderRoad]];
  const tabs = $("#tabs");
  TABS.forEach(([id, label]) => tabs.append(el("button", { class: "tab", role: "tab", id: "tab-" + id, "aria-selected": "false", onclick: () => show(id) }, label)));
  function show(id, arg) {
    if (!TABS.find(t => t[0] === id)) id = "map";
    TABS.forEach(([i]) => $("#tab-" + i).setAttribute("aria-selected", String(i === id)));
    const main = $("#main"); main.replaceChildren();
    TABS.find(t => t[0] === id)[2](main, arg);
    try { history.replaceState(null, "", "#" + id); } catch (e) { /* ignore */ }
  }


  /* ---------------- map ---------------- */
  const STATE_LABEL = { verified: "verified against a real peer", tested: "tested with mocks / shims", codec: "wire codec built, NF not yet", planned: "planned", peer: "test peer / outside the core" };
  function renderMap(main) {
    const W = 1130, H = 610, NW = 124, NH = 58;
    const pos = { UE: [70, 60], gNB: [70, 240], AMF: [300, 240], SMF: [560, 240], UPF: [820, 240], DN: [1040, 240], NSSF: [640, 90], BSF: [850, 90],
      UDM: [300, 390], AUSF: [110, 390], PCF: [560, 390], NEF: [1040, 390], UDR: [430, 540], NRF: [690, 540], SCP: [910, 540] };
    const curved = { N3: [445, 345], N29u: [670, 470] };
    const along = { "Nbsf-reg": 0.78, "Nbsf-dis": 0.78, N10: 0.28, N15: 0.28, N36: 0.35, Nnrf: 0.65 };
    const hidden = new Set();
    const svg = sv("svg", { class: "map", viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "5G core reference-point map" });
    const gE = sv("g"), gN = sv("g");
    svg.append(gE, gN);
    const panel = el("div");
    const nodeEls = {}, edgeEls = [];
    let selected = null;

    function edgeGeom(e) {
      const a = pos[e.a], b = pos[e.b];
      const clip = (p, q) => { const dx = q[0] - p[0], dy = q[1] - p[1]; const s = Math.min(dx ? (NW / 2) / Math.abs(dx) : 9e9, dy ? (NH / 2) / Math.abs(dy) : 9e9); return [p[0] + dx * s, p[1] + dy * s]; };
      const c = curved[e.id];
      if (c) { const p1 = [a[0], a[1] + NH / 2], p2 = [b[0], b[1] + NH / 2]; return { d: "M" + p1 + " Q" + c + " " + p2, mid: [(p1[0] + 2 * c[0] + p2[0]) / 4, (p1[1] + 2 * c[1] + p2[1]) / 4] }; }
      const p1 = clip(a, b), p2 = clip(b, a);
      const t = along[e.id] || 0.5;
      return { d: "M" + p1[0] + " " + p1[1] + " L" + p2[0] + " " + p2[1], mid: [p1[0] + (p2[0] - p1[0]) * t, p1[1] + (p2[1] - p1[1]) * t] };
    }
    D.edges.forEach(e => {
      if (!pos[e.a] || !pos[e.b]) return;
      const g = edgeGeom(e), grp = sv("g", { "data-state": e.state });
      const path = sv("path", { d: g.d, class: "edge e-" + e.state });
      const hit = sv("path", { d: g.d, class: "edge-hit" });
      const t = e.label, w = t.length * 6.6 + 12;
      const lab = sv("g", {}, sv("rect", { class: "elabel-bg", x: g.mid[0] - w / 2, y: g.mid[1] - 9, width: w, height: 17, rx: 8 }),
        sv("text", { class: "elabel", x: g.mid[0], y: g.mid[1] + 3.5, "text-anchor": "middle" }, t));
      grp.append(path, hit, lab);
      [hit, lab].forEach(x => x.addEventListener("click", () => select({ edge: e })));
      gE.append(grp); edgeEls.push({ e, grp, path });
    });
    D.nodes.forEach(n => {
      const [x, y] = pos[n.id];
      const g = sv("g", { class: "node " + n.status, tabindex: "0", role: "button", "aria-label": n.label + ", " + n.status }, sv("rect", { x: x - NW / 2, y: y - NH / 2, width: NW, height: NH, rx: 9 }),
        sv("text", { x, y: y + (n.phase != null ? -2 : 5), "text-anchor": "middle", "font-size": 15, "font-weight": 600 }, n.label),
        n.phase != null ? sv("text", { x, y: y + 15, "text-anchor": "middle", "font-size": 10.5 }, (n.status === "built" ? "built" : n.status === "shim" ? "temporary shim" : n.status === "partial" ? "half built" : "planned") + " · phase " + n.phase) : null);
      g.addEventListener("click", () => select({ node: n }));
      g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select({ node: n }); } });
      gN.append(g); nodeEls[n.id] = g;
    });
    gN.append(sv("text", { x: 910, y: 592, "text-anchor": "middle", "font-size": 10.5, style: "fill:var(--muted)" }, "SCP: indirect SBA routing, no edges drawn"));

    function select(sel) {
      selected = sel;
      const ids = new Set();
      if (sel.node) { ids.add(sel.node.id); D.edges.forEach(e => { if (e.a === sel.node.id || e.b === sel.node.id) { ids.add(e.a); ids.add(e.b); } }); }
      if (sel.edge) { ids.add(sel.edge.a); ids.add(sel.edge.b); }
      Object.entries(nodeEls).forEach(([id, g]) => { g.classList.toggle("dim", !ids.has(id)); g.classList.toggle("sel", sel.node && sel.node.id === id); });
      edgeEls.forEach(({ e, path }) => { const on = sel.edge ? sel.edge === e : sel.node && (e.a === sel.node.id || e.b === sel.node.id); path.classList.toggle("dim", !on); path.classList.toggle("sel", sel.edge === e); });
      detail(sel);
    }
    function detail(sel) {
      panel.replaceChildren();
      if (sel.edge) {
        const e = sel.edge;
